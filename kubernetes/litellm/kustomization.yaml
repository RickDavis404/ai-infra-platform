apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# LiteLLM gateway — RAW Kubernetes manifests (NOT the official Helm chart).
# The upstream chart bundles forbidden data subcharts (its own Postgres/Redis), so
# v7 deploys LiteLLM by hand and points it at the dedicated CloudNativePG cluster
# `litellm-pg` (reached as `litellm-pg-rw`) in this same namespace. See README.md
# for the raw-not-chart rationale, the master/virtual key model, and the recovery
# runbook.
#
# Apply order (see kubernetes/README.md): operators -> cilium -> namespaces ->
# stores -> apps (THIS) -> lgtm -> ingress. The provisioning Jobs under keys/ are a
# SEPARATE base (kubernetes/litellm/keys) applied AFTER the Deployment is Ready, so
# they can curl the live gateway; they are intentionally not listed here.
namespace: litellm

resources:
  # Cluster-scoped eviction/preemption shield for the gateway plane. ALSO applied by
  # kubernetes/langfuse-data/cnpg (stores phase) because litellm-pg references it and
  # applies before this overlay — see priorityclass.yaml's header.
  - priorityclass.yaml
  - deployment.yaml
  - service.yaml
  - proxy-config.yaml
  - pylogging-config.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: litellm
  app.kubernetes.io/part-of: ai-infra-platform
  app.kubernetes.io/component: gateway

# Virtual-key Job: smoke-test (team `service`). Mints the §15 smoke/validation key via
# POST /key/generate and writes the plaintext into Secret litellm-key-smoke-test
# (field `key`). Mirrored into fnox/age under SMOKE_TEST_LITELLM_VIRTUAL_KEY by the
# operator. Scoped to LOCAL routes only with a deliberately low budget/rate envelope.
#
# Idempotency: GET-then-PATCH-or-POST (no skip-if-exists). Shares the mint logic in
# the litellm-keymint-script ConfigMap; differs from the other key Jobs only by env.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-key-smoke-test
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      restartPolicy: OnFailure
      serviceAccountName: litellm-key-provisioner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-team-ids
          image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: litellm
            - name: TEAM_SECRET_NAME
              value: litellm-team-ids
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
          command:
            - python3
            - -c
            - |
              import os
              import ssl
              import time
              import urllib.error
              import urllib.request

              NS = os.environ["NAMESPACE"]
              SECRET = os.environ["TEAM_SECRET_NAME"]
              BASE = os.environ["LITELLM_BASE_URL"].rstrip("/")
              HOST = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
              PORT = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              SA = "/var/run/secrets/kubernetes.io/serviceaccount"
              with open(f"{SA}/token", encoding="utf-8") as fh:
                  token = fh.read().strip()
              ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
              secret_url = f"https://{HOST}:{PORT}/api/v1/namespaces/{NS}/secrets/{SECRET}"

              for _ in range(120):
                  ready = team = False
                  try:
                      with urllib.request.urlopen(
                          f"{BASE}/health/readiness", timeout=5
                      ) as resp:
                          ready = resp.status == 200
                  except urllib.error.URLError:
                      ready = False
                  try:
                      req = urllib.request.Request(
                          secret_url, headers={"Authorization": f"Bearer {token}"}
                      )
                      with urllib.request.urlopen(req, context=ctx, timeout=5) as resp:
                          team = resp.status == 200
                  except urllib.error.URLError:
                      team = False
                  if ready and team:
                      print("gateway ready and team-ids present")
                      raise SystemExit(0)
                  print(f"waiting (ready={ready}, team-ids={team})")
                  time.sleep(5)
              raise SystemExit("prerequisites not met in time")
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: mint-key
          image: python:3.12-slim@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
          imagePullPolicy: IfNotPresent
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-app-secrets
                  key: LITELLM_MASTER_KEY
            - name: KEY_VALUE
              valueFrom:
                secretKeyRef:
                  name: litellm-app-secrets
                  key: SMOKE_TEST_LITELLM_VIRTUAL_KEY
            - name: LITELLM_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000
            - name: NAMESPACE
              value: litellm
            - name: TEAM_SECRET_NAME
              value: litellm-team-ids
            - name: KEY_ALIAS
              value: smoke-test
            - name: TEAM_NAME
              value: service
            - name: KEY_SECRET_NAME
              value: litellm-key-smoke-test
            # Smoke key is scoped to local routes only (no subscription passthrough).
            - name: KEY_MODELS
              value: >-
                ["mac-local/unsloth/qwen3.5-4b-mtp-ud-q8-k-xl-gguf", "mac-local/gpustack/bge-m3",
                "mac-local/lmstudio-community/gemma-4-e2b-it-q8-0-gguf",
                "mac-local/unsloth/qwen3.5-4b-q4-k-s-gguf",
                "mac-local/lmstudio-community/llama-3.2-1b-instruct-q8-0-gguf",
                "mac-local/ibm-granite/granite-4.1-3b-q8-0-gguf",
                "mac-local/memoryco-ai/nemotron-3-nano-4b-q4-k-m-gguf"]
            - name: KEY_MAX_BUDGET
              value: "1000.0"
            - name: KEY_BUDGET_DURATION
              value: "1h"
            - name: KEY_RPM_LIMIT
              value: "100000"
            - name: KEY_TPM_LIMIT
              value: "200000000"
          command:
            - python3
            - /opt/keymint/mint_key.py
          volumeMounts:
            - name: keymint
              mountPath: /opt/keymint
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: keymint
          configMap:
            name: litellm-keymint-script
            items:
              - key: mint_key.py
                path: mint_key.py

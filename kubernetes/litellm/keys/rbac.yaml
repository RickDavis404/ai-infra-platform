# RBAC for the LiteLLM key-provisioning Jobs. Least privilege: the Jobs only need to
# read/create/patch Secrets in the litellm namespace (they GET the master key, GET the
# team-ids Secret, and write litellm-team-ids / litellm-key-<alias>). No cluster-scoped
# rights, no other verbs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-key-provisioner
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-key-provisioner
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-key-provisioner
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
subjects:
  - kind: ServiceAccount
    name: litellm-key-provisioner
    namespace: litellm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: litellm-key-provisioner

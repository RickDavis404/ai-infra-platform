apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
data:
  # Mounted at /etc/litellm/proxy_config.yaml and passed via --config. os.environ/*
  # references are resolved by LiteLLM at startup from the Deployment env (secretKeyRef
  # / values), so no secret material lives in this ConfigMap.
  proxy_config.yaml: |
    general_settings:
      forward_client_headers_to_llm_api: true   # keystone of both passthrough paths
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL      # CNPG-minted; secretKeyRef
      store_model_in_db: true
      store_prompts_in_spend_logs: true
      # DO NOT set litellm_key_header_name. The DEFAULT header x-litellm-api-key is
      # load-bearing: the litellm-database image tag pinned in deployment.yaml
      # hardcodes "x-litellm-api-key" in its OAuth auto-forwarding when deciding which
      # header authenticated the proxy, then refuses to forward that header.
      # Authenticating with the default name lets the client's Authorization (OAuth)
      # survive forwarding. A custom name drops the OAuth token.

    litellm_settings:
      drop_params: true
      # Max-capture: clients can NOT suppress logging with a `no-log: true` body param —
      # every callback (langfuse/otel/prometheus/s3_v2) always fires. This is a litellm.
      # module attribute, so it MUST live under litellm_settings (general_settings is a no-op).
      global_disable_no_log_param: true
      set_verbose: false
      num_retries: 3
      request_timeout: 600          # local models: 80-100K-token Claude Code context
      stream_timeout: 900           # cold load + prompt-processing before first chunk
      cooldown_time: 30
      success_callback: ["langfuse"]   # rich trace on every success
      failure_callback: ["langfuse"]   # rich trace on every failure
      callbacks: ["otel", "prometheus", "s3_v2"]   # s3_v2 fires on success AND failure
      langfuse_session_id_header: "X-Claude-Code-Session-Id"
      langfuse_default_tags:
        - proxy_base_url
        - user_api_key_alias
        - user_api_key_team_alias
        - user_api_key_user_email
        - model_group
        - cache_hit
        - semantic-similarity
      require_auth_for_metrics_endpoint: false   # localhost-only; document tradeoff
      # s3_v2 payload archive: full StandardLoggingPayload JSON (messages + response +
      # tokens + cost + metadata) per call, to the in-cluster SeaweedFS embedded S3.
      s3_callback_params:
        s3_bucket_name: litellm-payloads
        s3_endpoint_url: http://langfuse-seaweedfs-s3.langfuse-data.svc.cluster.local:8333
        s3_region_name: us-east-1                # SigV4 scope only; SeaweedFS ignores region
        s3_aws_access_key_id: os.environ/S3_ACCESS_KEY_ID
        s3_aws_secret_access_key: os.environ/S3_SECRET_ACCESS_KEY
        s3_use_virtual_hosted_style: false       # PATH-STYLE required for SeaweedFS
        s3_use_team_prefix: true                 # object keys prefixed by team alias
        s3_use_key_prefix: true                  # ...and by virtual-key alias
      # Promote the client spend-tag header to spend TAGS as well (pairs with the
      # x-litellm-spend-logs-metadata header the CLIs now send — see secret-env.sh / codex wrapper).
      extra_spend_tag_headers:
        - "x-litellm-spend-logs-metadata"

    model_list:
      # --- Local routes (§9.3) -------------------------------------------------
      # Default chat model (alias resolved at §9.6); the on-disk weights path is
      # supplied to llama-swap via AI_INFRA_DEFAULT_CHAT_MODEL_PATH, NOT to LiteLLM.
      # LiteLLM forwards the bare openai/<org>/<model> name.
      - model_name: "mac-local/unsloth/qwen3.5-4b-mtp-ud-q8-k-xl-gguf"
        litellm_params:
          model: "openai/unsloth/qwen3.5-4b-mtp-ud-q8-k-xl-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      # Additional small local chat models served by llama-swap (same host route).
      - model_name: "mac-local/lmstudio-community/gemma-4-e2b-it-q8-0-gguf"
        litellm_params:
          model: "openai/lmstudio-community/gemma-4-e2b-it-q8-0-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      - model_name: "mac-local/unsloth/qwen3.5-4b-q4-k-s-gguf"
        litellm_params:
          model: "openai/unsloth/qwen3.5-4b-q4-k-s-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      - model_name: "mac-local/lmstudio-community/llama-3.2-1b-instruct-q8-0-gguf"
        litellm_params:
          model: "openai/lmstudio-community/llama-3.2-1b-instruct-q8-0-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      - model_name: "mac-local/ibm-granite/granite-4.1-3b-q8-0-gguf"
        litellm_params:
          model: "openai/ibm-granite/granite-4.1-3b-q8-0-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      - model_name: "mac-local/memoryco-ai/nemotron-3-nano-4b-q4-k-m-gguf"
        litellm_params:
          model: "openai/memoryco-ai/nemotron-3-nano-4b-q4-k-m-gguf"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      # Embedding route KEPT (no default embedding model in v1; smoke-only when
      # explicitly enabled). bge-m3 served by llama-server --embedding via llama-swap.
      - model_name: "mac-local/gpustack/bge-m3"
        litellm_params:
          model: "openai/gpustack/bge-m3"
          api_base: "http://host.lima.internal:38080/v1"
          api_key: "none"

      # --- Claude Code Max passthrough (§9.5) ---------------------------------
      # Single wildcard captures the suffix and routes every current AND future
      # Claude model to anthropic/claude-*. The proxy holds NO Anthropic key; this
      # route is OAuth/subscription-only and is never valid in a fallbacks chain.
      - model_name: "claude-*"
        litellm_params:
          model: "anthropic/claude-*"

      # --- OpenAI / Codex passthrough (§9.4) ----------------------------------
      # Native chatgpt/ provider, made STARTUP-SAFE by the §8b client-OAuth
      # passthrough monkeypatch in the litellm-pylogging sitecustomize.py.
      # mode: responses marks the model as Responses-API native (Codex custom
      # providers use wire_api = "responses").
      #
      # WHY THIS IS NOW IN THE STATIC model_list (previously it was not): the stock
      # chatgpt/ provider at the litellm-database image tag in deployment.yaml resolves
      # auth EAGERLY (ChatGPTConfig
      # ._get_openai_compatible_provider_info / *.validate_environment both call
      # Authenticator.get_access_token()), which runs a BLOCKING interactive
      # device-flow OAuth when no token file exists — crashing/hanging proxy
      # startup on a headless cluster ("Application startup failed. Exiting.").
      # The §8b patch removes that hazard: it never invokes the blocking
      # device-flow at load time and instead reuses the Codex-forwarded ChatGPT
      # subscription OAuth (Authorization: Bearer + chatgpt-account-id) per
      # request. So the route loads hands-off and `mise run up` stays clean; the
      # subscription credential is supplied by the Codex client at request time,
      # never by the proxy. (Upstream lacks a native lazy/deferred-auth mode:
      # github.com/BerriAI/litellm#27175.)
      # gpt-5.3-codex is kept EXPLICIT: Codex CLI exposes `gpt-5.3-codex`, but the
      # ChatGPT Codex backend expects the subscription upstream slug
      # `gpt-5.3-codex-spark`. That slug rewrite is inexpressible in the gpt-*
      # wildcard below, and LiteLLM checks exact model_name matches before the
      # pattern router — so this exact model_name entry takes precedence over the
      # gpt-* wildcard below.
      - model_name: "gpt-5.3-codex"
        model_info: { mode: responses }
        litellm_params:
          model: "chatgpt/gpt-5.3-codex-spark"
          api_base: "https://chatgpt.com/backend-api/codex"
      # Single wildcard captures the suffix and routes every OTHER current AND
      # future gpt model (gpt-5.5, gpt-5.6-sol/terra/luna, ...) 1:1 to
      # chatgpt/gpt-<suffix>. Wildcard-matched deployments are deep-copied
      # (router_utils/pattern_match_deployments.py), so model_info.mode=responses
      # and api_base apply to every match. NOTE: the public gpt-* namespace is
      # RESERVED for the client-OAuth chatgpt passthrough — never add a
      # key-authenticated gpt-* route, or the sitecustomize (§8b) patch would
      # forward client ChatGPT OAuth headers to it. (Mirrors the claude-* wildcard
      # above: OAuth/subscription-only, never valid in a fallbacks chain.)
      - model_name: "gpt-*"
        model_info: { mode: responses }
        litellm_params:
          model: "chatgpt/gpt-*"
          api_base: "https://chatgpt.com/backend-api/codex"

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  # HA DEFAULT: minAvailable 1 keeps at least one gateway pod up through a voluntary
  # disruption (safe with 2 replicas). The AI_INFRA_PROFILE=lean overlay
  # (litellm/lean/) swaps this for maxUnavailable 1 on its single replica, so a node
  # drain can still evict the lone pod (a minAvailable:1 PDB on 1 replica would allow
  # 0 disruptions and block drains).
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm

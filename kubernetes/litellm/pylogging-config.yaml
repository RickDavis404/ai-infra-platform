apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-pylogging
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
data:
  # Mounted at /etc/litellm-pylogging and loaded via PYTHONPATH so Python imports it
  # automatically at interpreter startup (the `sitecustomize` hook). It has FOUR
  # responsibilities, in order:
  #   §8a — rewrite uvicorn.access records into structured JSON before LiteLLM's
  #         JsonFormatter handlers run (provider-neutral; installed first).
  #   §8b — ChatGPT client-OAuth passthrough monkeypatch (EXPERIMENTAL, §9.4):
  #         makes LiteLLM's chatgpt/ provider reuse the Codex-forwarded ChatGPT
  #         subscription OAuth (Authorization: Bearer + chatgpt-account-id) instead
  #         of running a BLOCKING device-flow at model-load. Opt-out with
  #         CHATGPT_PASSTHROUGH_PATCH=0; default-on. Pinned to the litellm-database
  #         image tag in deployment.yaml (version-coupled internals) and wholly
  #         best-effort — every import/override is guarded so a future image upgrade
  #         can never block or crash proxy startup. §8b-b6 additionally carries a
  #         classic-langfuse output backfill for codex /responses (co-located with
  #         the trace-naming hook; pairs with §8d).
  #   §8c — spend-log credential scrub (defence-in-depth): masks forwarded
  #         subscription-credential VALUES in the proxy_server_request.body snapshot
  #         that LiteLLM persists into every LiteLLM_SpendLogs row under the
  #         max-capture posture, WITHOUT touching the live request the upstream call
  #         forwards. Version-coupled and fully guarded like §8b; never mutates live
  #         passthrough state, and any failure leaves traffic unchanged.
  #   §8d — Responses-API streaming output recovery (LOG/CAPTURE): reconstructs the
  #         codex /responses assistant output that ChatGPT streams via
  #         output_item.done / output_text.done SSE events but omits from its empty
  #         terminal response.completed event, backfilling it into the assembled
  #         response BEFORE the logging snapshot so spend-logs, s3_v2 and langfuse all
  #         capture it. Reuses litellm's own sse_output_recovery helpers; version-
  #         coupled and fully guarded like §8b/§8c; only ever touches the logging
  #         object, never live passthrough state.
  sitecustomize.py: |
    """Structured uvicorn access logging for LiteLLM (§8a).

    Loaded automatically at interpreter startup because /etc/litellm-pylogging is on
    PYTHONPATH. Its single job is to convert uvicorn's positional access-log records
    (``'%s - "%s %s HTTP/%s" %d'`` with a 5-tuple of args) into a flat mapping of
    fields (client_addr / method / path / http_version / status_code) attached to the
    LogRecord, then route the record through a JSON formatter. This runs BEFORE
    LiteLLM installs its own JsonFormatter handlers, so access lines are emitted as
    valid JSON instead of the default human-readable string.

    Provider-neutral: it inspects no request bodies, headers, or credentials, and
    forwards nothing. It only reshapes the access log line.
    """

    import json
    import logging
    import os


    _ACCESS_LOGGER = "uvicorn.access"
    # uvicorn emits access records with exactly five positional args.
    _ACCESS_ARG_COUNT = 5


    class _UvicornAccessJsonFilter(logging.Filter):
        """Promote uvicorn's positional access args to structured record fields.

        uvicorn logs access lines as::

            logger.info('%s - "%s %s HTTP/%s" %d', client_addr, method, path,
                        http_version, status_code)

        We unpack that tuple onto the record so a JSON formatter can serialize named
        keys. Records that do not match the access shape are passed through untouched.
        """

        def filter(self, record: logging.LogRecord) -> bool:
            args = record.args
            if isinstance(args, tuple) and len(args) == _ACCESS_ARG_COUNT:
                client_addr, method, path, http_version, status_code = args
                record.client_addr = str(client_addr)
                record.method = str(method)
                record.path = str(path)
                record.http_version = str(http_version)
                try:
                    record.status_code = int(status_code)
                except (TypeError, ValueError):
                    record.status_code = status_code
                record.access = True
            return True


    class _UvicornAccessJsonFormatter(logging.Formatter):
        """Serialize access (and any other) records on this logger as one JSON line."""

        def format(self, record: logging.LogRecord) -> str:
            if getattr(record, "access", False):
                payload = {
                    "log": "uvicorn.access",
                    "level": record.levelname,
                    "logger": record.name,
                    "client_addr": getattr(record, "client_addr", None),
                    "method": getattr(record, "method", None),
                    "path": getattr(record, "path", None),
                    "http_version": getattr(record, "http_version", None),
                    "status_code": getattr(record, "status_code", None),
                }
            else:
                payload = {
                    "log": record.name,
                    "level": record.levelname,
                    "logger": record.name,
                    "message": record.getMessage(),
                }
            return json.dumps(payload, default=str)


    def _install() -> None:
        """Attach the filter+formatter to uvicorn.access and stop propagation.

        Idempotent: re-running attaches at most one handler/filter. Honors JSON_LOGS
        so a deployment that opts out of JSON logging keeps uvicorn's native format.
        """
        if os.environ.get("JSON_LOGS", "").strip().lower() not in {"true", "1", "yes"}:
            return

        access_logger = logging.getLogger(_ACCESS_LOGGER)

        if not any(
            isinstance(f, _UvicornAccessJsonFilter) for f in access_logger.filters
        ):
            access_logger.addFilter(_UvicornAccessJsonFilter())

        handler = next(
            (
                h
                for h in access_logger.handlers
                if getattr(h, "_litellm_access_json", False)
            ),
            None,
        )
        if handler is None:
            handler = logging.StreamHandler()
            handler._litellm_access_json = True  # type: ignore[attr-defined]
            access_logger.addHandler(handler)
        handler.setFormatter(_UvicornAccessJsonFormatter())

        # We own the rendering for this logger; don't double-emit via the root.
        access_logger.propagate = False


    try:
        _install()
    except Exception:  # noqa: BLE001 -- logging setup must never crash the proxy
        # Structured access logging is best-effort; never break interpreter startup.
        pass

    # ====================================================================
    # §8b — ChatGPT client-OAuth passthrough monkeypatch (EXPERIMENTAL).
    # Self-contained and fully guarded (see the docstring immediately
    # below). Installed AFTER §8a; this whole block lives at module level
    # inside the sitecustomize literal and never raises.
    # ====================================================================
    """§8b ChatGPT client-OAuth passthrough monkeypatch (EXPERIMENTAL, version-coupled).

    Pinned to the litellm-database image tag in deployment.yaml. Wholly
    best-effort: EVERY import and override is wrapped so that, on any future LiteLLM
    upgrade that moves/renames these private internals, the patch logs a warning and
    returns WITHOUT touching the proxy — interpreter/proxy startup can never be
    bricked by this code.

    Why it exists
    -------------
    The stock `chatgpt/` provider (llms/chatgpt) authenticates by calling
    `Authenticator.get_access_token()`, which — if no cached token exists at
    ~/.config/litellm/chatgpt/auth.json — runs a BLOCKING interactive device-flow
    OAuth (prints a verification URL and polls). When a `gpt-*` passthrough route is
    loaded that device-flow can fire and block, crashing the proxy on a headless cluster.

    This patch makes the chatgpt provider a CLIENT-OAUTH PASSTHROUGH: the Codex client
    already holds a ChatGPT-subscription OAuth token and forwards it as
    `Authorization: Bearer <access_token>` plus a `chatgpt-account-id` header. We
    prefer that forwarded credential over the device-flow authenticator. The
    authenticator is only consulted as a fallback, and even then its failure is
    swallowed (never raised at validate-time) so the provider can load and serve
    without any cached token — startup-safe.

    Behaviour
    ---------
    - `ChatGPTResponsesAPIConfig.validate_environment` / `ChatGPTConfig.validate_environment`
      / `ChatGPTConfig._get_openai_compatible_provider_info`: prefer a forwarded
      `Authorization: Bearer` (+ `chatgpt-account-id`) header; fall back to the
      authenticator only if none was forwarded, and NEVER raise on auth failure.
    - `ChatGPTResponsesAPIConfig.should_fake_stream`: unconditionally `False`. The stock
      implementation fake-streams any model absent from litellm's static
      model_prices_and_context_window.json registry (custom gpt-* slugs always are),
      which strips `stream` from the outbound body and 400s against chatgpt.com's
      backend-api (which requires literal `stream: true`, no non-streaming surface).
    - `litellm_pre_call_utils.add_provider_specific_headers_to_request`: in addition to
      the stock Anthropic behaviour, capture the Codex passthrough header allowlist
      from the inbound client request and attach them as a chatgpt-scoped
      `ProviderSpecificHeader` so they survive into the upstream call.
    - `LangFuseLogger.log_event_on_langfuse`: best-effort trace/generation naming for
      Codex turns (no credential is ever read or logged).
    """

    import logging
    import os

    _log = logging.getLogger("litellm.chatgpt_passthrough")

    # Toggle: default ON when the patch file is present, but allow an explicit opt-out.
    _ENABLED = os.environ.get("CHATGPT_PASSTHROUGH_PATCH", "1").strip().lower() not in {
        "0",
        "false",
        "no",
        "off",
    }

    # Prefixes for which a forwarded Authorization is REQUIRED — i.e. the passthrough
    # routes. PREFIX-scoped to mirror the router gpt-* wildcard: any gpt-*/codex-*
    # model (bare or chatgpt/-prefixed) is client-OAuth passthrough; any OTHER
    # provider prefix (anthropic/, openai/, mac-local/...) is excluded, preserving the
    # old exact-match safety — claude-* and mac-local/* can never be hijacked.
    _CHATGPT_PASSTHROUGH_PREFIXES = ("gpt-", "codex-")

    # Codex identity/passthrough headers forwarded verbatim to the ChatGPT upstream.
    _CHATGPT_PASSTHROUGH_HEADERS = (
        "authorization",
        "chatgpt-account-id",
        "originator",
        "session-id",
        "thread-id",
        "traceparent",
        "tracestate",
        "user-agent",
        "accept",
    )

    _CHATGPT_NO_IMAGE_GENERATION_MODELS = frozenset(
        base if not pfx else f"{pfx}{base}"
        for base in ("gpt-5.3-codex", "gpt-5.3-codex-spark")
        for pfx in ("", "chatgpt/")
    )


    def _is_passthrough_model(model) -> bool:
        if not model:
            return False
        name = str(model)
        if "/" in name:
            provider, _, short = name.partition("/")
            if provider != "chatgpt":
                return False
        else:
            short = name
        return short.startswith(_CHATGPT_PASSTHROUGH_PREFIXES)


    def _drop_unsupported_image_generation_tool(data, model) -> None:
        if not isinstance(data, dict) or not model:
            return
        name = str(model)
        short = name.split("/", 1)[-1]
        if name not in _CHATGPT_NO_IMAGE_GENERATION_MODELS and short not in (
            _CHATGPT_NO_IMAGE_GENERATION_MODELS
        ):
            return
        tools = data.get("tools")
        if not isinstance(tools, list):
            return
        filtered = [
            tool
            for tool in tools
            if not (
                isinstance(tool, dict)
                and str(tool.get("type", "")).lower() == "image_generation"
            )
        ]
        if len(filtered) != len(tools):
            if filtered:
                data["tools"] = filtered
            else:
                data.pop("tools", None)
            _log.info(
                "ChatGPT passthrough: stripped unsupported image_generation tool for %s.",
                model,
            )


    def _drop_unsupported_reasoning_summary(data, model) -> None:
        if not isinstance(data, dict) or not model:
            return
        name = str(model)
        short = name.split("/", 1)[-1]
        if name not in _CHATGPT_NO_IMAGE_GENERATION_MODELS and short not in (
            _CHATGPT_NO_IMAGE_GENERATION_MODELS
        ):
            return
        reasoning = data.get("reasoning")
        if not isinstance(reasoning, dict) or "summary" not in reasoning:
            return
        reasoning = dict(reasoning)
        reasoning.pop("summary", None)
        if reasoning:
            data["reasoning"] = reasoning
        else:
            data.pop("reasoning", None)
        _log.info(
            "ChatGPT passthrough: stripped unsupported reasoning.summary for %s.",
            model,
        )


    def _find_forwarded_authorization(headers):
        """Return (authorization_value, account_id) from a header mapping, or (None, None).

        Case-insensitive. Only a `Bearer ...` Authorization counts as a forwarded
        client-OAuth credential. The VALUE is never logged.
        """
        if not headers:
            return None, None
        auth = None
        account_id = None
        try:
            items = headers.items()
        except AttributeError:
            return None, None
        for key, value in items:
            kl = str(key).lower()
            if kl == "authorization" and value and str(value).lower().startswith("bearer "):
                auth = value
            elif kl == "chatgpt-account-id" and value:
                account_id = value
        return auth, account_id


    def _input_text_preview(litellm_params, limit: int = 120) -> str:
        """Best-effort short preview of the request input for Langfuse trace naming."""
        try:
            params = litellm_params
            if hasattr(params, "model_dump"):
                params = params.model_dump()
            if not isinstance(params, dict):
                return ""
            candidate = params.get("input") or params.get("messages")
            text = ""
            if isinstance(candidate, str):
                text = candidate
            elif isinstance(candidate, list):
                for item in candidate:
                    if isinstance(item, dict):
                        content = item.get("content")
                        if isinstance(content, str):
                            text = content
                            break
                        if isinstance(content, list):
                            for part in content:
                                if isinstance(part, dict) and isinstance(
                                    part.get("text"), str
                                ):
                                    text = part["text"]
                                    break
                        if text:
                            break
            text = " ".join(text.split())
            return text[:limit]
        except Exception:  # noqa: BLE001
            return ""


    def _patch_chatgpt_passthrough_auth() -> None:  # noqa: PLR0915
        if not _ENABLED:
            _log.info("ChatGPT passthrough patch disabled via CHATGPT_PASSTHROUGH_PATCH.")
            return

        # --- Import the version-specific internals (best-effort) -------------------
        try:
            from litellm.exceptions import AuthenticationError
            from litellm.llms.chatgpt.chat.transformation import ChatGPTConfig
            from litellm.llms.chatgpt.responses.transformation import (
                ChatGPTResponsesAPIConfig,
            )
            from litellm.llms.chatgpt.common_utils import (
                ensure_chatgpt_session_id,
                get_chatgpt_default_headers,
            )
        except Exception as exc:  # noqa: BLE001
            _log.warning(
                "ChatGPT passthrough patch: provider internals not importable (%s); "
                "skipping (startup unaffected).",
                exc,
            )
            return

        def _headers_with_forwarded_auth(self, headers, model, litellm_params):
            """Build upstream headers, preferring the forwarded client OAuth token.

            Returns the merged header dict. Never raises: if no forwarded auth AND the
            authenticator cannot produce a token, returns the (possibly auth-less)
            merged headers so model-load / validate never blocks or crashes.
            """
            forwarded_auth, forwarded_account = _find_forwarded_authorization(headers)
            session_id = ensure_chatgpt_session_id(litellm_params)

            if forwarded_auth:
                # Client-OAuth passthrough: trust the forwarded Bearer token. Derive an
                # account id from the header if present, else from the authenticator's
                # cached creds (best-effort), else omit.
                account_id = forwarded_account
                if not account_id:
                    try:
                        account_id = self.authenticator.get_account_id()
                    except Exception:  # noqa: BLE001
                        account_id = None
                access_token = str(forwarded_auth).split(" ", 1)[-1]
                default_headers = get_chatgpt_default_headers(
                    access_token, account_id, session_id
                )
                # Preserve the forwarded passthrough headers verbatim (case-insensitive).
                merged = {**default_headers}
                for key, value in (headers or {}).items():
                    if str(key).lower() in _CHATGPT_PASSTHROUGH_HEADERS:
                        merged[key] = value
                merged.update(headers or {})
                return merged

            # No forwarded credential for a passthrough model. Do NOT consult the
            # device-flow authenticator here: get_access_token() BLOCKS on an
            # interactive device-code login (polls up to 15 min) when no cached token
            # exists, which is exactly the startup/crash hazard this patch removes. A
            # passthrough route is client-OAuth-only by design, so with no forwarded
            # token we return auth-less headers; the upstream then returns 401, which
            # surfaces as an ordinary per-request error instead of a blocking boot.
            if _is_passthrough_model(model):
                _log.warning(
                    "ChatGPT passthrough: no forwarded Authorization for passthrough "
                    "model %s; forwarding without a subscription token (expect upstream "
                    "401). This route is client-OAuth-only.",
                    model,
                )
                return dict(headers or {})

            # Non-passthrough model: defer to the original behaviour by raising the
            # standard auth error path only if a token genuinely cannot be produced.
            try:
                access_token = self.authenticator.get_access_token()
                account_id = self.authenticator.get_account_id()
                default_headers = get_chatgpt_default_headers(
                    access_token, account_id, session_id
                )
                return {**default_headers, **(headers or {})}
            except Exception as exc:  # noqa: BLE001
                raise AuthenticationError(
                    model=str(model),
                    llm_provider="chatgpt",
                    message=str(exc),
                )

        # --- Override ChatGPTResponsesAPIConfig.validate_environment ---------------
        try:
            def _responses_validate_environment(self, headers, model, litellm_params):
                return _headers_with_forwarded_auth(self, headers, model, litellm_params)

            ChatGPTResponsesAPIConfig.validate_environment = _responses_validate_environment
            ChatGPTResponsesAPIConfig._chatgpt_passthrough_auth_patch = True
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: responses validate_environment patch failed (%s).", exc)

        # --- Override ChatGPTResponsesAPIConfig.should_fake_stream ------------------
        # The stock OpenAIResponsesAPIConfig.should_fake_stream() (inherited unless
        # overridden) calls litellm.utils.supports_native_streaming(), which looks the
        # model up in litellm's STATIC model_prices_and_context_window.json registry
        # and fail-closed returns False ("model doesn't support native streaming") for
        # any model name the lookup doesn't recognise. Our gpt-* passthrough slugs
        # (gpt-5.6-sol/terra/luna, ...) are custom names never published to that
        # registry, so the lookup misses and should_fake_stream() wrongly returns
        # True. When fake_stream is True, llm_http_handler._prepare_fake_stream_request()
        # does data.pop("stream", None) — deleting "stream" from the outbound JSON
        # body entirely — even though transform_responses_api_request() above
        # unconditionally set request["stream"] = True moments earlier. The POST to
        # https://chatgpt.com/backend-api/codex/responses then arrives with no
        # "stream" key at all; ChatGPT's backend-api has no non-streaming Responses
        # surface and rejects it: 400 {"detail":"Stream must be set to true"}.
        # Verified live against the deployed pod (2026-07-09/10): calling
        # ChatGPTResponsesAPIConfig().should_fake_stream(model=..., stream=True,
        # custom_llm_provider="chatgpt") returns False for "gpt-5.3-codex-spark"
        # (already known to the static registry, so unaffected) but True for
        # "gpt-5.6-sol" / "gpt-5.6-terra" / "gpt-5.6-luna" (unrecognised, so wrongly
        # faked) — matching the observed canary failures exactly. The ChatGPT
        # Responses API ALWAYS supports (and requires) native streaming, so faking a
        # stream is never correct for this provider regardless of what the static
        # model-cost registry does or doesn't contain; unconditionally disable it.
        try:
            def _chatgpt_should_fake_stream(self, model, stream, custom_llm_provider=None):
                return False

            ChatGPTResponsesAPIConfig.should_fake_stream = _chatgpt_should_fake_stream
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: should_fake_stream patch failed (%s).", exc)

        # --- Override ChatGPTConfig.validate_environment (chat path) ---------------
        try:
            def _chat_validate_environment(
                self,
                headers,
                model,
                messages,
                optional_params,
                litellm_params,
                api_key=None,
                api_base=None,
            ):
                # Run the stock OpenAI base validation first (sets content-type etc.),
                # but swallow any auth-related failure it surfaces.
                try:
                    from litellm.llms.openai.openai import OpenAIConfig

                    validated = OpenAIConfig.validate_environment(
                        self,
                        headers,
                        model,
                        messages,
                        optional_params,
                        litellm_params,
                        api_key,
                        api_base,
                    )
                except Exception:  # noqa: BLE001
                    validated = dict(headers or {})
                merged = _headers_with_forwarded_auth(self, headers, model, litellm_params)
                return {**merged, **validated}

            ChatGPTConfig.validate_environment = _chat_validate_environment
            ChatGPTConfig._chatgpt_passthrough_auth_patch = True
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: chat validate_environment patch failed (%s).", exc)

        # --- Override ChatGPTConfig._get_openai_compatible_provider_info -----------
        # This is the chat-path entry that eagerly calls get_access_token(); make it
        # tolerant so a missing token cannot raise at model resolution.
        try:
            def _get_openai_compatible_provider_info(
                self, model, api_base, api_key, custom_llm_provider
            ):
                try:
                    dynamic_api_base = self.authenticator.get_api_base()
                except Exception:  # noqa: BLE001
                    dynamic_api_base = api_base
                # Only use a token that is ALREADY cached on disk; do NOT call
                # get_access_token(), which BLOCKS on an interactive device-flow login
                # when no token file exists (the startup-crash hazard). A placeholder is
                # safe: the real credential is supplied per-request from the forwarded
                # Authorization header in validate_environment.
                dynamic_api_key = api_key or "passthrough"
                try:
                    auth_data = self.authenticator._read_auth_file()
                    if auth_data:
                        cached = auth_data.get("access_token")
                        if cached and not self.authenticator._is_token_expired(
                            auth_data, cached
                        ):
                            dynamic_api_key = cached
                except Exception:  # noqa: BLE001
                    pass
                return dynamic_api_base, dynamic_api_key, custom_llm_provider

            ChatGPTConfig._get_openai_compatible_provider_info = (
                _get_openai_compatible_provider_info
            )
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: provider_info patch failed (%s).", exc)

        # --- Forward the Codex passthrough headers to the chatgpt provider ---------
        try:
            from litellm.proxy import litellm_pre_call_utils as _pcu
            from litellm.types.utils import LlmProviders, ProviderSpecificHeader

            _orig_add_provider_specific_headers = (
                _pcu.add_provider_specific_headers_to_request
            )

            def _add_provider_specific_headers_to_request(data, headers):
                # Preserve stock Anthropic behaviour first.
                try:
                    _orig_add_provider_specific_headers(data=data, headers=headers)
                except Exception as exc:  # noqa: BLE001
                    _log.warning(
                        "ChatGPT passthrough: original add_provider_specific_headers "
                        "raised (%s); continuing.",
                        exc,
                    )

                try:
                    model = data.get("model") if isinstance(data, dict) else None
                    _drop_unsupported_image_generation_tool(data, model)
                    _drop_unsupported_reasoning_summary(data, model)
                    if not _is_passthrough_model(model):
                        return
                    # The `headers` passed here are ALREADY cleaned by clean_headers(),
                    # which DROPS a non-Anthropic `Authorization` — so the Codex ChatGPT
                    # OAuth Bearer is gone from `headers`. The raw inbound headers are
                    # preserved on data["secret_fields"].raw_headers (set just above the
                    # call site); read the forwarded credential from THERE.
                    raw_headers = {}
                    try:
                        sf = data.get("secret_fields") if isinstance(data, dict) else None
                        # secret_fields is a TypedDict -> dict; raw_headers is a key.
                        rh = None
                        if isinstance(sf, dict):
                            rh = sf.get("raw_headers")
                        else:
                            rh = getattr(sf, "raw_headers", None)
                        if isinstance(rh, dict):
                            raw_headers = rh
                    except Exception:  # noqa: BLE001
                        raw_headers = {}
                    # Prefer raw headers; fall back to the cleaned ones.
                    source_headers = raw_headers or (headers or {})
                    forwarded_auth, _ = _find_forwarded_authorization(source_headers)
                    if not forwarded_auth:
                        return
                    chatgpt_headers = {}
                    for key, value in source_headers.items():
                        if str(key).lower() in _CHATGPT_PASSTHROUGH_HEADERS and value:
                            chatgpt_headers[key] = value
                    if not chatgpt_headers:
                        return

                    # (1) Inject straight into data["extra_headers"]. This is the path the
                    # Responses API actually honours: extra_headers flows through to
                    # ChatGPTResponsesAPIConfig.validate_environment(headers=...), where the
                    # §8b override reads the forwarded Authorization. The chat path also
                    # picks these up. We do NOT overwrite a header the caller already set.
                    extra = data.get("extra_headers")
                    if not isinstance(extra, dict):
                        extra = {}
                    for key, value in chatgpt_headers.items():
                        extra.setdefault(key, value)
                    data["extra_headers"] = extra

                    # (2) Also record a chatgpt-scoped provider_specific_header so any code
                    # path that consults it (chat/non-responses) still sees the creds. Merge
                    # with any existing entry rather than clobber.
                    existing = data.get("provider_specific_header")
                    provider_csv = LlmProviders.CHATGPT.value
                    psh_headers = dict(chatgpt_headers)
                    if existing is not None:
                        try:
                            prev_provider = getattr(existing, "custom_llm_provider", "") or ""
                            prev_headers = dict(getattr(existing, "extra_headers", {}) or {})
                        except Exception:  # noqa: BLE001
                            prev_provider, prev_headers = "", {}
                        prev_headers.update(psh_headers)
                        psh_headers = prev_headers
                        if prev_provider:
                            provider_csv = f"{prev_provider},{LlmProviders.CHATGPT.value}"
                    data["provider_specific_header"] = ProviderSpecificHeader(
                        custom_llm_provider=provider_csv,
                        extra_headers=psh_headers,
                    )
                except Exception as exc:  # noqa: BLE001
                    _log.warning(
                        "ChatGPT passthrough: header-forward augmentation failed (%s).",
                        exc,
                    )

            _pcu.add_provider_specific_headers_to_request = (
                _add_provider_specific_headers_to_request
            )
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: pre-call header patch failed (%s).", exc)

        # --- Best-effort Langfuse trace naming + codex output backfill for Codex ---
        try:
            from litellm.integrations.langfuse.langfuse import LangFuseLogger

            try:
                from litellm.types.llms.openai import (
                    ResponsesAPIResponse as _ResponsesAPIResponse,
                )
            except Exception:  # noqa: BLE001
                _ResponsesAPIResponse = None

            _orig_log_event = LangFuseLogger.log_event_on_langfuse

            def _log_event_on_langfuse(self, kwargs, response_obj, *args, **lf_kwargs):
                try:
                    model = (kwargs or {}).get("model")
                    if _is_passthrough_model(model):
                        litellm_params = (kwargs or {}).get("litellm_params") or {}
                        metadata = litellm_params.get("metadata")
                        if not isinstance(metadata, dict):
                            metadata = {}
                            litellm_params["metadata"] = metadata
                            kwargs["litellm_params"] = litellm_params
                        metadata.setdefault(
                            "trace_name",
                            f"codex {model}: {_input_text_preview(litellm_params)}",
                        )
                        metadata.setdefault(
                            "generation_name", f"codex-{model}-responses"
                        )

                        # §8d-classic output backfill (co-located with §8b-b6).
                        # §8d already repairs standard_logging_object["response"].output
                        # at the streaming-iterator layer, and for streaming /responses
                        # the object handed here is normally that assembled
                        # ResponsesAPIResponse (complete_streaming_response) — so the
                        # stock isinstance(ResponsesAPIResponse) extractor already yields
                        # the recovered output. This is belt-and-suspenders for any path
                        # where stock extraction would still yield EMPTY output: unwrap a
                        # ResponseCompletedEvent to its inner ResponsesAPIResponse so the
                        # extractor branch fires, and if that output is STILL empty,
                        # backfill it from the standard_logging_object snapshot (which
                        # §8d populates). Only ever touches the logging object; never
                        # mutates live passthrough state, and only fires when output is
                        # empty (well-behaved responses are left untouched).
                        if _ResponsesAPIResponse is not None:
                            target = None
                            if isinstance(response_obj, _ResponsesAPIResponse):
                                target = response_obj
                            else:
                                inner = getattr(response_obj, "response", None)
                                if isinstance(inner, _ResponsesAPIResponse):
                                    target = inner
                                    response_obj = inner
                            if target is not None and not getattr(
                                target, "output", None
                            ):
                                slo = (kwargs or {}).get(
                                    "standard_logging_object"
                                ) or {}
                                slo_resp = (
                                    slo.get("response")
                                    if isinstance(slo, dict)
                                    else None
                                )
                                slo_out = (
                                    slo_resp.get("output")
                                    if isinstance(slo_resp, dict)
                                    else None
                                )
                                if slo_out:
                                    target.output = slo_out
                except Exception:  # noqa: BLE001
                    pass
                return _orig_log_event(self, kwargs, response_obj, *args, **lf_kwargs)

            LangFuseLogger.log_event_on_langfuse = _log_event_on_langfuse
        except Exception as exc:  # noqa: BLE001
            _log.warning("ChatGPT passthrough: langfuse trace-naming patch failed (%s).", exc)

        _log.info(
            "ChatGPT client-OAuth passthrough patch (§8b) installed; pinned to the "
            "litellm-database image tag in deployment.yaml."
        )


    try:
        _patch_chatgpt_passthrough_auth()
    except Exception:  # noqa: BLE001
        # The passthrough patch is best-effort; it must NEVER break interpreter startup.
        pass

    # ====================================================================
    # §8c — Spend-log credential scrub (defence-in-depth). Installed AFTER
    # §8b; like §8a/§8b it lives at module level inside the sitecustomize
    # literal, is fully guarded, and never raises.
    # ====================================================================
    """§8c spend-log credential scrub (version-coupled, fail-open).

    What it patches
    ---------------
    Wraps ``litellm.proxy.litellm_pre_call_utils.add_litellm_data_to_request`` (an
    async function). That function builds ``data["proxy_server_request"]`` — the
    verbatim request snapshot LiteLLM persists into the ``LiteLLM_SpendLogs`` row when
    ``store_prompts_in_spend_logs`` is on (this platform's max-capture posture). We
    post-process the RETURNED ``data`` so the snapshot under
    ``proxy_server_request["body"]`` has credential VALUES masked, WITHOUT altering the
    live request objects the upstream call forwards.

    Why it exists
    -------------
    The stock snapshot copies the forwarded subscription credentials verbatim into
    EVERY passthrough spend-log row: the Codex path stores the ChatGPT OAuth Bearer JWT
    + ``chatgpt-account-id`` under ``body.extra_headers`` (with a duplicate under
    ``body.provider_specific_header``); the Claude path stores the Claude Max OAuth
    token under ``body.litellm_metadata.headers.authorization``. No upstream knob strips
    ONLY these auth headers while keeping message/response capture:
    ``redact_user_api_key_info`` drops only ``user_api_key*`` keys, and
    ``turn_off_message_logging`` destroys the very capture this platform wants. This
    branch also removed the 90-day spend-log purge, turning a bounded exposure into a
    permanent one, so masking the snapshot is mandatory here.

    Correctness — replace-with-copy discipline
    -------------------------------------------
    In the pinned image ``body`` is a SHALLOW comprehension over ``data``
    (``{k: v for k, v in data.items() ...}``): a distinct dict, but its sub-values
    (``extra_headers``, ``metadata``, ``litellm_metadata``, ``provider_specific_header``)
    are the SAME objects the live request holds and that §8b's codex path
    (``secret_fields.raw_headers`` / ``data["extra_headers"]`` /
    ``provider_specific_header``) and anthropic forwarding read downstream. So we NEVER
    mutate those sub-dicts in place: we build freshly masked copies and substitute them
    into a shallow copy of ``body``, then reassign only
    ``proxy_server_request["body"]``. ``provider_specific_header`` is dropped from that
    body copy — never popped from the live ``data`` (the shallow ``dict(body)`` copy
    keeps that safe even in a hypothetical future image where ``body is data``). Message
    I/O, tags, user-agent and ``x-litellm-spend-logs-metadata`` all survive untouched.

    Import ordering
    ---------------
    Rebinds the MODULE attribute ``litellm_pre_call_utils.add_litellm_data_to_request``.
    sitecustomize is preloaded via PYTHONPATH and runs before ``proxy_server.py`` does
    its ``from ... import add_litellm_data_to_request``, so that from-import binds THIS
    wrapper — mirroring §8b, which likewise patches only the module attribute and relies
    on the same preload ordering.

    Version + fail-open guarantee
    -----------------------------
    Verified against the pinned litellm-database image ``v1.92.0-rc.2`` (see
    deployment.yaml): ``add_litellm_data_to_request`` is async, returns ``data``, and
    fills ``proxy_server_request["body"]`` with the shallow snapshot described above.
    A no-op if the symbol is missing (future litellm drift). Any exception — at install
    OR per-request — logs a warning and leaves traffic completely unchanged; this code
    can neither block nor crash the proxy.
    """

    _scrub_log = logging.getLogger("litellm.spend_log_scrub")

    # Header names whose VALUES are credentials; masked case-insensitively wherever
    # they appear inside the spend-log body snapshot.
    _SPEND_LOG_SECRET_HEADERS = frozenset(
        {
            "authorization",
            "proxy-authorization",
            "x-api-key",
            "x-litellm-api-key",
            "api-key",
            "x-goog-api-key",
            "chatgpt-account-id",
            "openai-organization",
            "cookie",
        }
    )
    _SPEND_LOG_MASK = "***REDACTED***"


    def _mask_secret_headers(headers):
        """Return a NEW dict with secret-header VALUES masked (case-insensitive).

        Non-dict input is returned unchanged. The original mapping is never mutated, so
        the caller can substitute the result into the snapshot while the live request
        keeps the real credential.
        """
        if not isinstance(headers, dict):
            return headers
        masked = {}
        for key, value in headers.items():
            if str(key).lower() in _SPEND_LOG_SECRET_HEADERS and value:
                masked[key] = _SPEND_LOG_MASK
            else:
                masked[key] = value
        return masked


    def _scrub_spend_log_credentials(data) -> None:
        """Mask credential VALUES in ``data["proxy_server_request"]["body"]``.

        Only the snapshot is altered, and only by substituting NEW dicts — the live
        request sub-dicts (shared by reference) are never mutated.
        """
        if not isinstance(data, dict):
            return
        psr = data.get("proxy_server_request")
        if not isinstance(psr, dict):
            return
        body = psr.get("body")
        if not isinstance(body, dict):
            return

        # Work on a shallow copy of the body so that, even in a hypothetical future
        # image where ``body is data``, we never pop from or mutate the live dict.
        new_body = dict(body)

        # (1) extra_headers — the Responses/codex passthrough credential carrier.
        extra = new_body.get("extra_headers")
        if isinstance(extra, dict):
            new_body["extra_headers"] = _mask_secret_headers(extra)

        # (2) metadata.headers / litellm_metadata.headers — the claude carrier. Rebuild
        # the metadata dict (new object) so every OTHER metadata field is preserved.
        for meta_key in ("metadata", "litellm_metadata"):
            meta = new_body.get(meta_key)
            if isinstance(meta, dict) and isinstance(meta.get("headers"), dict):
                new_meta = dict(meta)
                new_meta["headers"] = _mask_secret_headers(meta["headers"])
                new_body[meta_key] = new_meta

        # (3) Drop the duplicate credential carrier entirely from the snapshot. This
        # removes the key from new_body ONLY (never from the live ``data``).
        new_body.pop("provider_specific_header", None)

        psr["body"] = new_body


    def _patch_spend_log_credential_scrub() -> None:
        try:
            from litellm.proxy import litellm_pre_call_utils as _pcu
        except Exception as exc:  # noqa: BLE001
            _scrub_log.warning(
                "Spend-log scrub patch: litellm_pre_call_utils not importable (%s); "
                "skipping (startup unaffected).",
                exc,
            )
            return

        _orig_add_litellm_data = getattr(_pcu, "add_litellm_data_to_request", None)
        if _orig_add_litellm_data is None:
            _scrub_log.warning(
                "Spend-log scrub patch: add_litellm_data_to_request missing; skipping "
                "(startup unaffected)."
            )
            return

        async def _add_litellm_data_to_request(*args, **kwargs):
            data = await _orig_add_litellm_data(*args, **kwargs)
            try:
                _scrub_spend_log_credentials(data)
            except Exception as exc:  # noqa: BLE001
                _scrub_log.warning(
                    "Spend-log scrub: masking failed (%s); leaving the snapshot "
                    "unchanged.",
                    exc,
                )
            return data

        # Rebind the MODULE attribute (see the "Import ordering" note above): the
        # preloaded sitecustomize runs before proxy_server.py's from-import, so the
        # from-import binds this wrapper. Mirrors §8b's module-attribute patch style.
        _pcu.add_litellm_data_to_request = _add_litellm_data_to_request
        _scrub_log.info(
            "Spend-log credential scrub patch (§8c) installed; pinned to the "
            "litellm-database image tag in deployment.yaml."
        )


    try:
        _patch_spend_log_credential_scrub()
    except Exception:  # noqa: BLE001
        # The spend-log scrub patch is best-effort; it must NEVER break startup.
        pass

    # ====================================================================
    # §8d — Responses-API streaming output recovery (LOG/CAPTURE).
    # Installed AFTER §8c; like §8a/§8b/§8c it lives at module level inside
    # the sitecustomize literal, is fully guarded, and never raises.
    # ====================================================================
    """§8d Responses-API streaming output recovery (version-coupled, fail-open).

    What it patches
    ---------------
    Wraps TWO methods on
    ``litellm.responses.streaming_iterator.BaseResponsesAPIStreamingIterator``:
    ``_process_chunk`` (to ACCUMULATE streamed output items as the SSE events flow
    through) and ``_log_completed_response`` (to BACKFILL an empty terminal
    ``response.output`` from those accumulated items, immediately before the logging
    snapshot is taken). ``_log_completed_response`` is defined once on the base class
    and inherited by every concrete iterator, so a single wrap covers the sync, async
    and mock/cached paths.

    Symptom
    -------
    codex ``/v1/responses`` streaming assistant text is captured in NO sink — the
    Postgres ``LiteLLM_SpendLogs`` ``response->'output'`` is an empty array, the
    s3_v2 payload stores an empty response, and the Langfuse generation output is
    empty — despite real ``completion_tokens`` and the client visibly receiving the
    text (e.g. "pong").

    Root cause
    ----------
    ChatGPT's ``backend-api/codex`` streams the assistant text via
    ``response.output_item.done`` / ``response.output_text.done`` SSE events but ships
    an EMPTY ``output`` array in its terminal ``response.completed`` event. LiteLLM's
    real-streaming iterator stores that terminal event verbatim
    (``self.completed_response = <ResponseCompletedEvent with .response.output == []>``)
    and NEVER runs the SSE output-recovery that its own BUFFERED path
    (``ChatGPTResponsesAPIConfig._extract_completed_response_from_sse`` ->
    ``_build_completed_response_from_chunk``) uses. Because ChatGPT 400s on any
    non-streaming Responses request (``{"detail":"Stream must be set to true"}``), the
    buffered-recovery path is unreachable and ``should_fake_stream=False`` (§8b-b2) is
    mandatory — it is NOT the fixable cause. Every logging sink reads the same empty
    ``standard_logging_object["response"]``, so a callback change is structurally
    incapable of fixing it; the reconstruction MUST happen at the streaming-iterator
    layer, which then repairs every sink at once.

    Mechanism (mirrors the buffered recovery exactly)
    -------------------------------------------------
    The ``_process_chunk`` wrap reuses LiteLLM's OWN
    ``litellm.responses.sse_output_recovery`` helpers (``record_output_item_chunk`` /
    ``record_output_text_chunk``) to record OUTPUT_ITEM_DONE / OUTPUT_TEXT_DONE events
    into per-iterator dicts keyed by ``output_index``. On the terminal event the
    backfill merges them with real OUTPUT_ITEM_DONE items taking precedence over
    text-only items at the same index (``merged = {**text_only}; merged.update(real)``)
    and — ONLY when the terminal ``response.output`` is empty — assigns the sorted
    list, exactly the guard + precedence of ``_build_completed_response_from_chunk``
    (``response_payload["output"] = [item for _, item in sorted(...)]`` iff
    ``not response_payload.get("output") and streamed_output_items``). The ``output``
    field on ``ResponsesAPIResponse`` is typed ``List[Union[ResponseOutputItem, Dict]]``,
    so assigning the recovered raw dicts in place is type-valid and serialises cleanly.

    Timing (why the backfill lives in ``_log_completed_response``)
    -------------------------------------------------------------
    ``_process_chunk`` sets ``self.completed_response`` AND, in the SAME call,
    dispatches the success handlers via ``_handle_logging_completed_response`` ->
    ``_log_completed_response`` — which snapshots the response with
    ``type(...).model_validate(...model_dump())`` and hands that COPY to every sink.
    A backfill performed after ``_process_chunk`` returns would be too late: the
    snapshot has already frozen the empty output. Wrapping ``_log_completed_response``
    backfills ``self.completed_response.response.output`` immediately BEFORE that
    snapshot, so spend-logs, s3_v2 and the classic/otel langfuse callbacks all observe
    the repaired output. (The classic langfuse callback additionally receives the
    already-repaired assembled response; the §8b-b6 backfill is belt-and-suspenders.)

    Version + fail-open guarantee
    -----------------------------
    Verified against the pinned litellm-database image ``v1.92.0-rc.2``: the enum
    members (``OUTPUT_ITEM_DONE`` / ``OUTPUT_TEXT_DONE`` / ``RESPONSE_COMPLETED`` on the
    ``str``-based ``ResponsesAPIStreamEvents``), the recovery-helper signatures, and
    the iterator method names/shapes all match. A no-op if any symbol is missing
    (future litellm drift) and idempotent (a sentinel prevents double-wrapping). Every
    accumulation and backfill is wrapped so it can neither block nor crash the proxy,
    and it only ever touches the logging object — never live passthrough state.
    Upstreamable: the streaming iterator SHOULD call the ``sse_output_recovery``
    helpers the buffered path already uses (to be filed against BerriAI/litellm).
    """

    _recovery_log = logging.getLogger("litellm.responses_output_recovery")


    def _patch_responses_streaming_output_recovery() -> None:
        try:
            from litellm.responses.streaming_iterator import (
                BaseResponsesAPIStreamingIterator,
            )
            from litellm.responses.sse_output_recovery import (
                record_output_item_chunk,
                record_output_text_chunk,
            )
            from litellm.types.llms.openai import ResponsesAPIStreamEvents
        except Exception as exc:  # noqa: BLE001
            _recovery_log.warning(
                "Responses output-recovery patch: internals not importable (%s); "
                "skipping (startup unaffected).",
                exc,
            )
            return

        # Idempotent: never wrap twice (mirrors §8b/§8c sentinel discipline).
        if getattr(
            BaseResponsesAPIStreamingIterator,
            "_responses_output_recovery_patch",
            False,
        ):
            return

        _orig_process_chunk = BaseResponsesAPIStreamingIterator._process_chunk
        _orig_log_completed = BaseResponsesAPIStreamingIterator._log_completed_response

        def _process_chunk_with_output_recovery(self, chunk):
            # Accumulate the streamed output items BEFORE delegating to the original
            # per-chunk handler. The `chunk` here is the SSE `data:`-stripped field
            # content (SSEDecoder output), i.e. the same string the original
            # `_process_chunk` will `json.loads` — so we parse it directly (do NOT
            # re-strip `data:`). A cheap substring gate avoids re-parsing the (often
            # large) delta stream twice; the exact enum comparison below is the real
            # filter, so a false-positive substring is harmless.
            try:
                if isinstance(chunk, str) and (
                    "output_item.done" in chunk or "output_text.done" in chunk
                ):
                    parsed = json.loads(chunk)
                    if isinstance(parsed, dict):
                        event_type = parsed.get("type")
                        if event_type == ResponsesAPIStreamEvents.OUTPUT_ITEM_DONE:
                            if not hasattr(self, "_rec_output_items"):
                                self._rec_output_items = {}
                            record_output_item_chunk(parsed, self._rec_output_items)
                        elif event_type == ResponsesAPIStreamEvents.OUTPUT_TEXT_DONE:
                            if not hasattr(self, "_rec_output_items"):
                                self._rec_output_items = {}
                            if not hasattr(self, "_rec_text_items"):
                                self._rec_text_items = {}
                            record_output_text_chunk(
                                parsed,
                                self._rec_output_items,
                                self._rec_text_items,
                            )
            except Exception:  # noqa: BLE001
                # Accumulation is best-effort; never disturb stream processing.
                pass
            return _orig_process_chunk(self, chunk)

        def _log_completed_response_with_output_recovery(self, *args, **kwargs):
            # Backfill an empty terminal `response.output` from the accumulated items
            # BEFORE the original snapshots the response for logging. Mirrors
            # `_build_completed_response_from_chunk`: real OUTPUT_ITEM_DONE items take
            # precedence over text-only items at the same output_index, and the
            # backfill fires ONLY when the terminal output is empty.
            try:
                completed = getattr(self, "completed_response", None)
                resp = getattr(completed, "response", None)
                if resp is not None and not getattr(resp, "output", None):
                    merged = {**getattr(self, "_rec_text_items", {})}
                    merged.update(getattr(self, "_rec_output_items", {}))
                    if merged:
                        resp.output = [item for _, item in sorted(merged.items())]
                        _recovery_log.info(
                            "§8d: reconstructed %d Responses-API output item(s) from "
                            "streamed SSE events (terminal response.output was empty).",
                            len(merged),
                        )
            except Exception:  # noqa: BLE001
                # Backfill is best-effort; never break the logging path.
                pass
            return _orig_log_completed(self, *args, **kwargs)

        BaseResponsesAPIStreamingIterator._process_chunk = (
            _process_chunk_with_output_recovery
        )
        BaseResponsesAPIStreamingIterator._log_completed_response = (
            _log_completed_response_with_output_recovery
        )
        BaseResponsesAPIStreamingIterator._responses_output_recovery_patch = True
        _recovery_log.info(
            "Responses-API streaming output recovery patch (§8d) installed; pinned to "
            "the litellm-database image tag in deployment.yaml."
        )


    try:
        _patch_responses_streaming_output_recovery()
    except Exception:  # noqa: BLE001
        # The output-recovery patch is best-effort; it must NEVER break startup.
        pass

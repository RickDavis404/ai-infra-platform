apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cilium CNI, inlined via Helm and rendered with `kustomize build --enable-helm`.
# Pin is exact (1.20.0-rc.0, pre-release); it does not float. Re-test IPAM, kubeProxyReplacement, and
# (if enabled) the L7 knobs on any version bump. See README.md for provenance.
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.0-rc.0
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
    includeCRDs: true

# LB-IPAM pool + L2 announcement policy for Service-type LoadBalancer VIPs on the
# socket_vmnet shared subnet. These CRs depend on the Cilium CRDs the chart installs;
# the k8s:cilium task applies the chart first, waits ready, then applies these.
resources:
  - lb-ipam-pool.yaml
  - l2-announcement-policy.yaml

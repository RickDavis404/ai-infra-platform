# Namespace guardrails for the app, data, and observability planes.
#
# These are lab safety ceilings, not production sizing promises. CPU/memory quotas
# use requests only so the scheduler budget is bounded without injecting surprise
# runtime CPU or memory caps into chart sidecars. LimitRanges provide low default
# requests for any chart container that omits them.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-requests
  namespace: litellm
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-namespace-budget
  namespace: litellm
spec:
  hard:
    pods: "16"
    persistentvolumeclaims: "8"
    requests.cpu: "4"
    requests.memory: 8Gi
    requests.storage: 60Gi
    services.loadbalancers: "2" # gateway VIP (.200) + litellm-pg -ro LB VIP (.206)
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-requests
  namespace: langfuse
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-namespace-budget
  namespace: langfuse
spec:
  hard:
    pods: "12"
    persistentvolumeclaims: "0"
    requests.cpu: "3"
    requests.memory: 8Gi
    services.loadbalancers: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-requests
  namespace: langfuse-data
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-namespace-budget
  namespace: langfuse-data
spec:
  hard:
    pods: "32"
    persistentvolumeclaims: "32"
    requests.cpu: "6"
    requests.memory: 18Gi
    requests.storage: 180Gi
    # Data plane is exposed to the Mac via Cilium LB VIPs for read-only MCP access
    # (all-VIP, no port-forward): langfuse-pg `-ro` (.205) + clickhouse-langfuse-ch (.207).
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-requests
  namespace: lgtm
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-namespace-budget
  namespace: lgtm
spec:
  hard:
    pods: "40"
    persistentvolumeclaims: "16"
    requests.cpu: "6"
    requests.memory: 16Gi
    requests.storage: 90Gi
    services.loadbalancers: "2"

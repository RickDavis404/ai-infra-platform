apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# In-cluster OpenTelemetry Collector — THE OTLP gateway (§13.2.1) and the general
# container-log path. DaemonSet (one collector per node). Inlined via Helm and
# rendered with `kustomize build --enable-helm`. Pin is exact (chart 0.164.1); it
# does not float. See README.md for provenance, the 64 MiB ceiling rationale
# (§13.2.4), and the GenAI OTTL keystone (§13.2.2).

# The chart renders NO Service in daemonset mode, so the OTLP gateway Service is a
# raw resource here: a type=LoadBalancer Service named `otel-collector` that both
# backs the in-cluster `otel-collector.lgtm.svc.cluster.local:4318` DNS name AND
# carries the Cilium LB-IPAM host VIP 192.168.105.203 (:4317 gRPC + :4318 HTTP) for
# direct host/codex OTLP over the shared L2 (D005 / ha-networking.md §4).
resources:
  - lb-service.yaml

helmCharts:
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.164.1
    releaseName: otel-collector
    namespace: lgtm
    valuesFile: values.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lgtm

helmCharts:
  - name: tempo
    repo: https://grafana-community.github.io/helm-charts
    version: 2.2.3
    releaseName: tempo
    namespace: lgtm
    valuesFile: values.yaml
    includeCRDs: false

patches:
  - path: patches/tempo-lifecycle-patch.yaml
    target:
      kind: StatefulSet
      name: tempo

generatorOptions:
  disableNameSuffixHash: true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AI_INFRA_PROFILE=lean overlay for Loki (SimpleScalable logs store).
#
# Loki's replication_factor is baked into the Helm-rendered `loki` config ConfigMap
# (a YAML string blob), which a post-render field patch cannot address — so the
# helmChart block is RE-DECLARED and re-inflated with the base values plus the lean
# overrides:
#   valuesFile: ../values.yaml
#   additionalValuesFiles: [../values-lean.yaml]  (RF 1 + write/read/backend/gateway 1)
#
# The `../` value-file references are ABOVE this root, so renders pass
# `--load-restrictor LoadRestrictionsNone` (apply.sh / render-all.sh / diff.sh /
# down.sh). generatorOptions mirrors the base for identical name handling.
#
# Chart pin MUST equal the base (loki 18.4.3); a Renovate bump to ../kustomization.yaml
# will NOT touch this copy — keep them in lock-step (planning §5 helm-version drift).
namespace: lgtm

helmCharts:
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.4.3
    releaseName: loki
    namespace: lgtm
    valuesFile: ../values.yaml
    additionalValuesFiles:
      - ../values-lean.yaml
    includeCRDs: false

generatorOptions:
  disableNameSuffixHash: true

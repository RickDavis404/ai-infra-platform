apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lgtm

# The dedicated CNPG Cluster that backs Grafana's database (grafana-pg-rw +
# grafana-pg-app). It is a raw CR resource (not part of the Helm chart). The
# CloudNativePG operator + CRDs (kubernetes/operators/cnpg) MUST be applied first —
# this is an operators-before-CRs dependency documented in README.md.
resources:
  - grafana-pg.yaml

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 12.7.2
    releaseName: grafana
    namespace: lgtm
    valuesFile: values.yaml
    includeCRDs: false

generatorOptions:
  disableNameSuffixHash: true

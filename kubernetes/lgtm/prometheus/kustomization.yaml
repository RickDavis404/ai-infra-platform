apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prometheus — standalone, StatefulSet + 2 replicas, hard anti-affinity, served
# under the `/prometheus` route-prefix (§6.3.7 / §13.1.2). Inlined via Helm and
# rendered with `kustomize build --enable-helm`. Pin is exact (chart 29.13.1); it
# does not float. See README.md for the route-prefix gotcha and the documented
# no-dedup 2-replica exception.
helmCharts:
- name: prometheus
  repo: https://prometheus-community.github.io/helm-charts
  version: 29.13.1
  releaseName: prometheus
  namespace: lgtm
  valuesFile: values.yaml

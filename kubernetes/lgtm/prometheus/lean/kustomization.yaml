apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AI_INFRA_PROFILE=lean overlay for Prometheus.
#
# The lean delta is a Helm value (server.resources.requests.memory) and the parent
# DIRECTORY cannot be used as a base (containment cycle), so the prometheus
# helmChart is RE-DECLARED here with the base values plus the lean override:
#   valuesFile: ../values.yaml + additionalValuesFiles: [../values-lean.yaml]
#   (memory request 1Gi -> 512Mi — reverts the HA meltdown-fix floor to the
#   schedulable low; see ../values-lean.yaml for the rationale)
#
# The `../` value-file references are ABOVE this root, so renders pass
# `--load-restrictor LoadRestrictionsNone` (apply.sh / render-all.sh / diff.sh /
# down.sh). Chart pin MUST equal the base (prometheus 29.14.0); a Renovate bump to
# ../kustomization.yaml will NOT touch this copy — keep them in lock-step
# (planning §5 helm-version drift). Referenced by lgtm/lean, not by apply.sh
# directly (profile selection happens at the lgtm unit level).
helmCharts:
- name: prometheus
  repo: https://prometheus-community.github.io/helm-charts
  version: 29.14.0
  releaseName: prometheus
  namespace: lgtm
  valuesFile: ../values.yaml
  additionalValuesFiles:
  - ../values-lean.yaml

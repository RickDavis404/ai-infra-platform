# PROFILE: HA base (rendered by 'mise run up:ha'); the default 'mise run up' renders the lean overlay in ./lean/ instead. See docs/profiles.md.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-pg
  namespace: langfuse-data
spec:
  # HA DEFAULT: 3-instance quorum (primary + 2 standbys) spread one-per-node by the
  # required pod anti-affinity below. The AI_INFRA_PROFILE=lean overlay patches this
  # to instances 1 (+ enablePDB:false, - synchronous) for the 16GiB single-host
  # profile — see cnpg/lean/. The CNPG operator emits the primary PDB (minAvailable 1)
  # by default; with 3 instances a node drain still leaves a quorum, so it is kept
  # (enablePDB:false is a LEAN-only override).
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:233d7414ff5c1e4951e85389fb4bec31c18f35be1d7d47eea5aa296a46af0b5f
  # Pinned tag: skip the re-pull on idempotent re-apply so repeated runs don't hit
  # the registry's anonymous pull-rate limit (HTTP 429).
  imagePullPolicy: IfNotPresent
  primaryUpdateStrategy: unsupervised
  # Expose the read-only (-ro, standbys) endpoint on a Cilium LoadBalancer VIP so the
  # Mac reaches Postgres directly at 192.168.105.205:5432 — no port-forward (mirrors
  # kubernetes/litellm/service.yaml). The default ClusterIP -rw/-ro/-r services remain.
  managed:
    services:
      additional:
        - selectorType: ro
          serviceTemplate:
            metadata:
              name: langfuse-pg-ro-lb
              annotations:
                lbipam.cilium.io/ips: "192.168.105.205"
            spec:
              type: LoadBalancer
              loadBalancerClass: io.cilium/l2-announcer
              externalTrafficPolicy: Cluster
  postgresql:
    parameters:
      timezone: UTC                 # Langfuse requires UTC
    # Quorum-synchronous replication: every commit must be acknowledged by at least
    # `number` of the (instances-1) standbys before the client sees success (RPO 0 on
    # a single node loss). REQUIRES instances >= 3 (number < instances-1); the
    # AI_INFRA_PROFILE=lean overlay REMOVES this block when it drops to instances 1
    # (with a lone primary and no standby, a synchronous commit would block forever).
    synchronous:
      method: any
      number: 1
  bootstrap:
    initdb:
      database: postgres_langfuse
      owner: langfuse
      secret: { name: langfuse-pg-app }   # provides username + password keys (fnox+age)
  storage:
    storageClass: local-path
    size: 10Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required   # spread the 3 instances across the 3 nodes
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { memory: 1Gi }
  monitoring:
    enablePodMonitor: true          # CNPG operator emits a PodMonitor (:9187 /metrics); Alloy discovers all PodMonitors cluster-wide
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: /metrics
  # --- OPTIONAL: Barman PITR to SeaweedFS (off by default; enable for prod-like recovery) ---
  # backup:
  #   barmanObjectStore:
  #     destinationPath: s3://langfuse-pg-backups/
  #     endpointURL: http://langfuse-seaweedfs-s3.langfuse-data.svc.cluster.local:8333
  #     s3Credentials:
  #       accessKeyId:     { name: langfuse-app-secrets, key: s3-access-key-id }
  #       secretAccessKey: { name: langfuse-app-secrets, key: s3-secret-access-key }

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ClickHouse custom resources for the Langfuse data plane. These are raw
# Altinity CRs (CHK + CHI) reconciled by the operator installed in
# `kubernetes/operators/clickhouse-operator/`. Apply Keeper first so its quorum
# Service exists before the CHI references it via spec.configuration.zookeeper.
namespace: langfuse-data

resources:
- keeper.yaml
- chi.yaml

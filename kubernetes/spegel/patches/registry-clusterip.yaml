# Convert the chart's spegel-registry Service from NodePort to ClusterIP.
#
# WHY: this lab is localhost + `kubectl port-forward` ONLY — no node-level Service
# surface may survive into the rendered output (enforced by validate:no-nodeport;
# host access to real services is via Cilium LB-IPAM VIPs, never node-level Service
# ports). The Spegel chart defaults the registry Service to an externally reachable
# peer transport on port 30021. Peer-to-peer mirroring does NOT depend on that path:
#   - In the chart's default mode (service.registry.usePreferSameNodeTrafficDistribution
#     = false, kept in values.yaml), each Spegel pod also exposes the registry on a
#     HOST PORT (29020 — see values.yaml: pinned below Cilium's 30000-32767 NodePort
#     range because kube-proxy-replacement silently drops the 30020 chart default) and
#     the FIRST containerd mirror-target is http://$(NODE_IP):29020 — so a peer on node A
#     fetches layers directly from node B's host port (hostPort is explicitly allowed by
#     validate:no-nodeport's scope note; the Cilium agent DaemonSet uses hostPort too).
#   - The secondary mirror-target http://$(NODE_IP):30021 still resolves: as a ClusterIP
#     Service it load-balances to a peer pod in-cluster. Demoting to ClusterIP only
#     removes the externally-reachable NodePort surface, not the peer path.
# Peer DISCOVERY/routing is over the libp2p router (port 5001) + the headless
# spegel-bootstrap Service (clusterIP: None) and is unaffected by this change.
#
# JSON6902 so we can DELETE the chart-assigned node port field (a strategic-merge can't remove a
# scalar list element cleanly). Target is matched by kind+name in kustomization.yaml.
- op: replace
  path: /spec/type
  value: ClusterIP
- op: remove
  path: /spec/ports/0/nodePort

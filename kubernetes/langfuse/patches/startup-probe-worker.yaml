# startupProbe hardening patch (strategic merge) for the langfuse-worker Deployment.
#
# WHY: the worker owns the ClickHouse migrations. On a FRESH bring-up it runs 34
# `ON CLUSTER ... alter_sync=2` DDL migrations (clickhouse.migration.autoMigrate:
# true) plus Prisma/Postgres cold start and app init before /api/health answers.
# MEASURED on constrained Apple-Silicon Lima hardware with a fresh DB: this one-time
# first boot takes ~10 min, NOT the ~60-75s an earlier estimate assumed — the budget
# below is sized to cover it in a single startup window (too small a budget SIGTERMs
# mid-migration each cycle and `mise run up`'s rollout wait times out first).
# The pinned chart (1.5.40) templates only a livenessProbe for the worker
# and has NO startupProbe (verified in charts/.../templates/worker/deployment.yaml).
# With no startupProbe the livenessProbe probes during migration and SIGTERMs the
# pod mid-migration, so golang-migrate leaves a "Dirty database" and the worker
# crashloops forever.
#
# A startupProbe suspends liveness (and readiness) until the app first answers,
# giving the slow cold start a 1200s / 20-min budget (periodSeconds 10 *
# failureThreshold 120; timeoutSeconds 10 so a health check can exceed 5s while the
# Node event loop is busy during init) instead of the ~47s the default livenessProbe
# allows — sized from the measured ~10-min first boot with margin. Verified live on the mini
# via `kubectl patch` — adding this startupProbe let migrations complete and both
# langfuse deployments reached Ready. That live patch is ephemeral (a rebuild /
# helm sync reverts it); this patch persists it in the repo.
#
# Path/port/scheme match the chart's worker livenessProbe (GET /api/health on the
# named `http` container port). Container name is `langfuse-worker`
# (`.Chart.Name`-worker). Targeted in kustomization.yaml by kind: Deployment +
# name: langfuse-worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: langfuse
spec:
  template:
    spec:
      containers:
        - name: langfuse-worker
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 120

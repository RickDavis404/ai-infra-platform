# secrets/kustomization.yaml  (COMMITTED — references a GITIGNORED runtime file)
#
# ┌─ NOT THE AUTHORITATIVE MATERIALIZER ─────────────────────────────────────────┐
# │ `mise run secrets:sync` is the AUTHORITATIVE producer of every Kubernetes     │
# │ Secret. It REMAPS fnox keys to the exact consumer key names (e.g. fnox        │
# │ LANGFUSE_SALT -> k8s `salt`, VALKEY_PASSWORD -> `redis-password`), creates     │
# │ the CNPG `<cluster>-app` basic-auth Secrets, builds the SeaweedFS             │
# │ `seaweedfs_s3_config` JSON, and mirrors the S3 creds cross-namespace — none    │
# │ of which a flat `secretGenerator` can do (it cannot rename keys or set the    │
# │ basic-auth type). Run `mise run secrets:sync` to materialize for real.         │
# │                                                                                │
# │ This kustomization is a SIMPLE STRUCTURE-PREVIEW path ONLY: it renders the 4   │
# │ shared Secrets below from shared.env.dec so you can eyeball the shape without  │
# │ a live cluster. The key names it emits are the RAW fnox names (un-remapped),   │
# │ so its output is illustrative, not directly consumable by every chart.         │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# This kustomization turns one decrypted env file into namespaced Kubernetes Secret
# SHELLS for preview (§11.3). It is RUNTIME-ONLY: it references `shared.env.dec`,
# which is produced by `mise run secrets:sync` (fnox decrypt) and is GITIGNORED.
# The `.dec` is NEVER committed.
#
# Render/apply (the sync task does this for you):
#   mise run secrets:sync
# which is equivalent to:
#   fnox export -f env -o secrets/shared.env.dec   # transient, gitignored
#   kubectl kustomize secrets/ | kubectl apply -f -
#   rm -f secrets/shared.env.dec                   # under a trap
#
# To preview the STRUCTURE locally without real secrets, copy the committed example
# placeholder file into place first (placeholders only, never real values):
#   cp secrets/shared.env.example secrets/shared.env.dec
#   kubectl kustomize secrets/
#   rm -f secrets/shared.env.dec
#
# A SINGLE shared.env.dec is the cross-namespace mirror source: the same decrypted
# value (e.g. VALKEY_PASSWORD, LANGFUSE_PG_PASSWORD) is written into multiple
# namespaced Secrets from one place, so rotating a value means re-sealing once in fnox
# and re-running the sync task — every namespace picks up the new value.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  # Stable Secret names so controllers reference fixed names across namespaces.
  disableNameSuffixHash: true

secretGenerator:
  - name: langfuse-app-secrets
    namespace: langfuse
    envs:
      - shared.env.dec
  - name: langfuse-shared-passwords
    namespace: langfuse-data
    envs:
      - shared.env.dec
  - name: litellm-app-secrets
    namespace: litellm
    envs:
      - shared.env.dec
  - name: grafana-admin
    namespace: lgtm
    envs:
      - shared.env.dec

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]

[mcp_servers.grafana]
command = "uvx"
args = ["mcp-grafana", "--disable-write"]

[mcp_servers.grafana.env]
GRAFANA_URL = "http://192.168.105.202:3000"

# Disable any stale user-level stdio Langfuse entry; Codex deep-merges MCP tables.
[mcp_servers.langfuse]
enabled = false

[mcp_servers.langfuse_http]
url = "http://192.168.105.201:3000/api/public/mcp"
env_http_headers = { Authorization = "LANGFUSE_MCP_AUTH_HEADER" }

[shell_environment_policy]
inherit = "core"

[sandbox_workspace_write]
network_access = true

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]

# Max-capture: tool/function outputs are middle-truncated at ~10,000 BYTES by default
# before history+model; raise to a 128k-token budget (tests exercise 100k). MUST stay a
# TOP-LEVEL key (before the first table) so codex honors it, not a nested table key.
tool_output_token_limit = 128000

# history.persistence default is already save-all with NO max_bytes cap — keep defaults
# (explicitly: do NOT set persistence="none" or max_bytes). ~/.codex/history.jsonl grows
# unbounded; disk headroom is checked in the verification battery (§F).

[mcp_servers.grafana]
command = "uvx"
args = ["mcp-grafana", "--disable-write"]

[mcp_servers.grafana.env]
GRAFANA_URL = "http://192.168.105.202:3000"

[mcp_servers.langfuse_http]
url = "http://192.168.105.201:3000/api/public/mcp"
env_http_headers = { Authorization = "LANGFUSE_MCP_AUTH_HEADER" }

[shell_environment_policy]
inherit = "core"

[sandbox_workspace_write]
network_access = true

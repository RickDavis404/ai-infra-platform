# 10-env.toml — non-secret [env] for the ai-infra-platform repo.
#
# mise merges every .config/mise/conf.d/*.toml in lexical order. This file owns the
# [env] table only. NO secret material lives here (fnox+age is the only secret store).

[env]
KUBECONFIG    = "{{config_root}}/.local/kube/config" # repo-local kubeconfig (copyToHost target, under .local)
LIMA_INSTANCE = "ai-inf-platform"                             # Lima instance base name (kubeadm pivot, D005)

# Repo-launcher bin dir: a committed TTY-preserving `codex` wrapper shadows the mise-managed
# binary so a bare `codex` in a repo shell gets the full gateway/-c provider overrides.
_.path = ["{{config_root}}/.config/bin"]

# Localhost-only port-forward defaults (UIs require creds; no anon access).
LITELLM_PORT   = "34000"
LANGFUSE_PORT  = "33000"
GRAFANA_PORT   = "33001"
OTEL_HTTP_PORT = "34318"

# Default chat model alias (path resolved from this var, never hardcoded absolute).
AI_INFRA_DEFAULT_CHAT_MODEL = "mac-local/unsloth/qwen3.5-4b-mtp-ud-q8-k-xl-gguf"
# AI_INFRA_DEFAULT_CHAT_MODEL_PATH is set by the user's machine / host-service config,
# NOT committed here (it is a local filesystem path).

# --- Configurable cluster network plane (defaults; a later task makes the manifests
# consume these instead of hardcoding the IPs). All on the socket_vmnet shared subnet.
AI_INFRA_LIMA_NETWORK    = "shared"             # Lima network name (limactl network; `init` may override)
AI_INFRA_SHARED_SUBNET   = "192.168.105.0/24"   # the socket_vmnet shared network CIDR
AI_INFRA_CP_VIP          = "192.168.105.40"     # kube-vip control-plane VIP (API server)
AI_INFRA_LB_RANGE_START  = "192.168.105.200"    # Cilium LB-IPAM pool start
AI_INFRA_LB_RANGE_STOP   = "192.168.105.250"    # Cilium LB-IPAM pool stop
AI_INFRA_LITELLM_VIP     = "192.168.105.200"    # LiteLLM gateway service VIP
AI_INFRA_LANGFUSE_VIP    = "192.168.105.201"    # Langfuse web service VIP
AI_INFRA_GRAFANA_VIP     = "192.168.105.202"    # Grafana service VIP
AI_INFRA_OTEL_VIP        = "192.168.105.203"    # OTel Collector OTLP service VIP
AI_INFRA_HUBBLE_VIP      = "192.168.105.204"    # Hubble UI service VIP
AI_INFRA_LANGFUSE_PG_VIP = "192.168.105.205"    # langfuse-pg `-ro` Postgres LB VIP (MCP)
AI_INFRA_LITELLM_PG_VIP  = "192.168.105.206"    # litellm-pg `-ro` Postgres LB VIP (MCP)
AI_INFRA_CLICKHOUSE_VIP  = "192.168.105.207"    # ClickHouse (langfuse-ch) HTTP LB VIP (MCP)

# Docker Hub pull-through cache (the long-lived `ai-registry` VM — NOT an ai-inf-platform-* node,
# so cluster teardown never deletes it). containerd on every node mirrors docker.io
# through this host:port so repeated cold standups do ~0 docker.io pulls (dodges the
# anon 429 rate limit). socket_vmnet `shared` has no static IP, so `mise run cache:up`
# DISCOVERS the VM's DHCP IP and overrides this in the gitignored 99-local.toml. This
# committed default is the documented fallback (used only if cache:up never ran).
AI_INFRA_REGISTRY_ADDR   = "192.168.105.50:5000"

# --- Agent → platform passthrough (NON-SECRET; VIPs referenced from the vars above).
# mise resolves {{env.X}} against env set earlier in this same [env] table, so the
# AI_INFRA_*_VIP defaults above flow through here. Secrets (virtual keys, passwords)
# are NEVER here — they are composed by secret-env.sh (_.source at the end).

# Claude Code → LiteLLM gateway VIP (model traffic) + retry budget.
ANTHROPIC_BASE_URL                         = "http://{{env.AI_INFRA_LITELLM_VIP}}:4000"
# Retry watchdog (v2.1.199+): lifts the 15-retry hard cap (which silently clamped the old
# MAX_RETRIES=100 since v2.1.186) and raises non-capacity transient-error retries to 300.
CLAUDE_CODE_RETRY_WATCHDOG                 = "1"
MAX_STRUCTURED_OUTPUT_RETRIES              = "50"

# OpenTelemetry: Claude Code → OTel Collector VIP (OTLP/HTTP protobuf).
CLAUDE_CODE_ENABLE_TELEMETRY          = "1"
CLAUDE_CODE_ENHANCED_TELEMETRY_BETA   = "1"
OTEL_METRICS_EXPORTER                 = "otlp"
OTEL_LOGS_EXPORTER                    = "otlp"
OTEL_TRACES_EXPORTER                  = "otlp"
OTEL_EXPORTER_OTLP_PROTOCOL           = "http/protobuf"
OTEL_EXPORTER_OTLP_METRICS_ENDPOINT   = "http://{{env.AI_INFRA_OTEL_VIP}}:4318/v1/metrics"
OTEL_EXPORTER_OTLP_LOGS_ENDPOINT      = "http://{{env.AI_INFRA_OTEL_VIP}}:4318/v1/logs"
OTEL_EXPORTER_OTLP_TRACES_ENDPOINT    = "http://{{env.AI_INFRA_OTEL_VIP}}:4318/v1/traces"
# Resource attrs = deployment env + DYNAMIC git context (Lane D1), resolved once at shell-init by a
# mise tera exec (which runs under `sh -o errexit`, so every step is failure-tolerant): repo =
# origin-remote slug (`basename -s .git`) → git-toplevel dir basename → `unknown`; branch =
# `git branch --show-current` → `detached`. printf keeps it single-line (no trailing newline) and it
# NEVER errors outside a git repo. Feeds every metric/log/trace (both CLIs honor this one var).
OTEL_RESOURCE_ATTRIBUTES              = "deployment.environment=ai-infra-platform-local,{{ exec(command='r=$(git config --get remote.origin.url 2>/dev/null || true); [ -n \"$r\" ] && r=$(basename -s .git \"$r\" 2>/dev/null || true) || true; [ -n \"$r\" ] || r=$(basename \"$(git rev-parse --show-toplevel 2>/dev/null || true)\" 2>/dev/null || true); [ -n \"$r\" ] || r=unknown; b=$(git branch --show-current 2>/dev/null || true); [ -n \"$b\" ] || b=detached; printf \"%s\" \"vcs.repository.name=$r,vcs.branch.name=$b\"') }}"
# Prompt/response/tool content capture (Claude-only OTEL_LOG_* toggles).
OTEL_LOG_USER_PROMPTS                 = "1"
OTEL_LOG_TOOL_DETAILS                 = "1"
OTEL_LOG_TOOL_CONTENT                 = "1"
OTEL_LOG_ASSISTANT_RESPONSES          = "1"    # v2.1.193+; explicit (would inherit OTEL_LOG_USER_PROMPTS anyway)
# --- Max-capture additions (verified against claude-code 2.1.216 docs) ---
# Raw API bodies (untruncated, one file per request/response) — file mode writes to disk
# and emits only a body_ref attr over OTLP; the host alloy filelog ships the files to Loki.
# The dir MUST pre-exist (created by init.sh + host/up.sh + the claude launch tasks).
OTEL_LOG_RAW_API_BODIES               = "file:{{config_root}}/.local/logs/claude/otel-raw-bodies"

# Content ceiling (max-override): raise Claude's per-body OTLP content cap from the 60 KB
# default to 64 MiB — matches the pipeline (Loki max_line_size 64 MB) and CC_LANGFUSE_MAX_CHARS.
CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH   = "67108864"

# Diagnostics + shutdown/flush (max-override): print exporter errors to stderr, and give the
# batch processors up to 600s to drain on exit/flush so nothing is lost at shutdown.
CLAUDE_CODE_OTEL_DIAG_STDERR          = "1"
CLAUDE_CODE_OTEL_SHUTDOWN_TIMEOUT_MS  = "600000"
CLAUDE_CODE_OTEL_FLUSH_TIMEOUT_MS     = "600000"

# Session + subagent capture (max-override): persist session state, forward subagent text into the
# parent trace, tolerate hour-long async-agent stalls, and lift the Task-tool output cap.
CLAUDE_CODE_FORCE_SESSION_PERSISTENCE = "1"
CLAUDE_CODE_FORWARD_SUBAGENT_TEXT     = "1"
CLAUDE_ASYNC_AGENT_STALL_TIMEOUT_MS   = "3600000"
TASK_MAX_OUTPUT_LENGTH                = "160000"

# Export cadence (explicit-default): pin the SDK defaults so a future SDK change can't drift them.
OTEL_METRIC_EXPORT_INTERVAL           = "60000"
OTEL_LOGS_EXPORT_INTERVAL             = "5000"
OTEL_TRACES_EXPORT_INTERVAL           = "5000"
OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE = "delta"

# Anti-drop batch queues (shared claude+codex via the OTel SDK): raise the max queue from the
# 2048 default (silently drops events under burst) to 16384; export batch size <= queue size.
OTEL_BLRP_MAX_QUEUE_SIZE              = "16384"   # logs  (BatchLogRecordProcessor)
OTEL_BLRP_MAX_EXPORT_BATCH_SIZE       = "2048"
OTEL_BSP_MAX_QUEUE_SIZE               = "16384"   # spans (BatchSpanProcessor)
OTEL_BSP_MAX_EXPORT_BATCH_SIZE        = "2048"

# Attribute count-limit margin (Claude honors these; codex is fixed at 128): raise from the
# 128 default to 512 so attribute-rich spans/logs aren't clipped.
OTEL_ATTRIBUTE_COUNT_LIMIT            = "512"
OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT       = "512"
OTEL_LOGRECORD_ATTRIBUTE_COUNT_LIMIT  = "512"

# Metrics cardinality controls (Claude-only) — one aligned block.
# REF: https://code.claude.com/docs/en/monitoring-usage#metrics-cardinality-control
# explicit-default (default true — pinned so they can't drift):
OTEL_METRICS_INCLUDE_SESSION_ID       = "true"
OTEL_METRICS_INCLUDE_ACCOUNT_UUID     = "true"
OTEL_METRICS_INCLUDE_RESOURCE_ATTRIBUTES = "true"
# max-override (default false → true — attach version + entrypoint to every metric):
OTEL_METRICS_INCLUDE_VERSION          = "true"
OTEL_METRICS_INCLUDE_ENTRYPOINT       = "true"

# REQUIRED with a custom ANTHROPIC_BASE_URL: forces W3C traceparent propagation to the
# LiteLLM gateway (default suppresses it for non-Anthropic base URLs) -> CLI<->gateway span join.
CLAUDE_CODE_PROPAGATE_TRACEPARENT     = "1"

# Claude scratch dir (Lane F): project-local temp (dir created by init.sh + host/up.sh; .local/ gitignored).
CLAUDE_CODE_TMPDIR                    = "{{config_root}}/.local/tmp-claude"

# OTLP export timeouts, 5x the 10000ms spec default. CODEX-SCOPE NOTE: of everything in this OTel
# block, codex's Rust exporter honors ONLY these 4 *_TIMEOUT vars + OTEL_RESOURCE_ATTRIBUTES +
# OTEL_METRIC_EXPORT_INTERVAL + the OTEL_BSP_*/OTEL_BLRP_* batch knobs (shared SDK). EVERY other
# OTEL_*/CLAUDE_CODE_* var here is Claude-only; codex gets its equivalents from ~/.codex/config.toml
# [otel] (written by `mise run codex:global-config`).
OTEL_EXPORTER_OTLP_TIMEOUT            = "50000"
OTEL_EXPORTER_OTLP_METRICS_TIMEOUT    = "50000"
OTEL_EXPORTER_OTLP_LOGS_TIMEOUT       = "50000"
OTEL_EXPORTER_OTLP_TRACES_TIMEOUT     = "50000"

# A8 (GATED — Lane G): tool-search deferral. Leave UNSET for now; unset already loads all tools
# upfront under a gateway. Uncomment ONLY after the remote LiteLLM tool_reference passthrough test
# (Lane G) passes — otherwise `auto`/`true` make requests fail on tool_reference rejection.
# ENABLE_TOOL_SEARCH = "auto"

# ── DELIBERATELY UNSET (documented — max-capture posture) ─────────────────────────────────────
# These are intentionally NOT set; setting any of them would REDUCE capture:
#   OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT / OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT /
#     OTEL_LOGRECORD_ATTRIBUTE_VALUE_LENGTH_LIMIT — unset = unlimited = max; the real content cap
#     is CLAUDE_CODE_OTEL_CONTENT_MAX_LENGTH (above). Any value here could only truncate.
#   OTEL_TRACES_SAMPLER / OTEL_TRACES_SAMPLER_ARG — unset keeps the default
#     parentbased_always_on = capture every trace (any sampler here could only drop traces).
#   CLAUDE_CODE_ATTRIBUTION_HEADER — unset keeps attribution metadata on requests.
#   DISABLE_* family (DISABLE_TELEMETRY, DISABLE_COST_WARNINGS, …) + OTEL_SDK_DISABLED — ANY
#     non-empty value (INCLUDING "0" / "false") disables the feature, so they stay UNSET, never "0".

# Langfuse tracing + MCP (base URL/host at the langfuse-web VIP; read-only MCP).
LANGFUSE_BASE_URL     = "http://{{env.AI_INFRA_LANGFUSE_VIP}}:3000"
CC_LANGFUSE_MAX_CHARS = "67108864"
LANGFUSE_HOST         = "http://{{env.AI_INFRA_LANGFUSE_VIP}}:3000"
LANGFUSE_MCP_READ_ONLY = "true"

# Langfuse codex-observability-plugin — CLIENT-SIDE codex capture (a codex `Stop` hook
# reads each turn's rollout and uploads it to Langfuse as a SEPARATE trace, correlated
# to the gateway trace by codex session id). Install per-machine with
# `mise run codex:install-plugins`; these env knobs are read by the plugin's hook:
#   - LANGFUSE_BASE_URL (above) + LANGFUSE_PUBLIC_KEY/SECRET_KEY (secret-env.sh) auth the upload
#   - TRACE_TO_LANGFUSE opts the plugin in (default off)
#   - LANGFUSE_CODEX_MAX_CHARS caps per-field capture, raised to the 64 MiB max-capture
#     posture (plugin default is 20000), matching CC_LANGFUSE_MAX_CHARS for Claude.
# Inert unless the plugin is installed AND its Stop hook is trusted (one-time per machine).
TRACE_TO_LANGFUSE        = "true"
LANGFUSE_CODEX_MAX_CHARS = "67108864"

# Grafana MCP (URL at the grafana VIP; admin USERNAME non-secret, password via fnox).
GRAFANA_URL      = "http://{{env.AI_INFRA_GRAFANA_VIP}}:3000"
GRAFANA_USERNAME = "admin"

# ClickHouse MCP (host at the ClickHouse VIP; password via fnox).
CLICKHOUSE_HOST   = "{{env.AI_INFRA_CLICKHOUSE_VIP}}"
CLICKHOUSE_PORT   = "8123"
CLICKHOUSE_USER   = "default"
CLICKHOUSE_SECURE = "false"

# fnox-decrypted secrets (virtual keys, passwords, composed DSNs) are exported by
# this committed script on `cd`. redact=true hides the values in `mise env` output.
_.source = { path = "{{config_root}}/.config/mise/secret-env.sh", redact = true }

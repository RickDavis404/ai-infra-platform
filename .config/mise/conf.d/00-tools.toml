# 00-tools.toml — pinned [tools] toolchain for the ai-infra-platform repo.
#
# mise merges every .config/mise/conf.d/*.toml in lexical order into the project
# config. This file owns the [tools] table only.
#
# Host-service binaries (lima, llama.cpp, llama-swap, mlx-lm, macmon) are
# Homebrew-managed, NOT mise-managed — see Brewfile (§8.3). Exception: otelcol-contrib
# has no brew formula, so it is pinned here via the ubi backend (see bottom section).

[tools]
# --- Secrets toolchain ---
age  = "1.3.1"     # age encryption (fnox backend) — current stable (verified in mise registry)
fnox = "1.28.0"    # fnox secret resolver — current stable (the prior 0.5.0 pin did not exist)

# --- Kubernetes client tooling ---
kubectl      = "1.36.2"
kustomize    = "5.8.1"
helm         = "4.2.2"
"cilium-cli" = "0.19.5"

# --- Lint / format / scan (also surfaced via pre-commit, §8.2/§8.3) ---
shellcheck = "0.11.0"
shfmt      = "3.13.1"
# yamllint via the pipx backend: it installs yamllint into its own venv WITH its
# pyyaml dependency, so both the `yamllint` CLI AND validate:yaml's structural
# PyYAML parse have `yaml` available (mise's default backend pulled the wheel but
# left the venv's interpreter off any general PATH → "No module named 'yaml'").
"pipx:yamllint" = "1.38.0"
gitleaks   = "8.30.1"
pre-commit = "4.6.0"

# --- Utilities ---
jq = "1.8.2"
yq = "4.53.3"

# --- Diagram + docs toolchain (mermaid-cli / design-doc-mermaid skill) ---
node    = "24"          # mermaid-cli engine (^18.19 || >=20); current LTS Krypton
python  = "3.13"        # design-doc-mermaid skill utilities (stdlib only)
ripgrep = "15"          # `rg`, used by validate:private-names / validate:no-bitnami
# mmdc on PATH via the npm backend. NOTE: `mise install` does NOT fetch the headless
# Chrome mermaid-cli needs (puppeteer is a peer dep + npm --ignore-scripts), so a
# one-time `mise run tools:mmdc-setup` is still required. See that task.
"npm:@mermaid-js/mermaid-cli" = "11.16.0"

# --- Host telemetry collector (ubi backend — no Homebrew formula exists) ---
# otelcol-contrib has no brew-core formula, so mise's `ubi` backend fetches the pinned
# GitHub release binary. Pin tracks the version the host currently runs
# (`otelcol-contrib --version` → 0.152.1; also research/docs/homebrew-host-services.md).
# The opentelemetry-collector-releases release ships several distro tarballs, so
# `matching=`/`exe=` select the contrib asset and its executable specifically.
# HOST FOLLOW-UP (NOT done here — config-only): launchd loads the binary from
# ~/.local/bin/otelcol-contrib (setup/mac-side/launchd/com.ai-infra.otelcol.plist).
# Adopting this pin still needs a host step to stage/symlink the mise-managed binary
# into ~/.local/bin and reload launchd; the running collector is intentionally untouched.
"ubi:open-telemetry/opentelemetry-collector-releases[exe=otelcol-contrib,matching=otelcol-contrib]" = "0.152.1"
